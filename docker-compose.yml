services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; resp = urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if resp.getcode() == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
